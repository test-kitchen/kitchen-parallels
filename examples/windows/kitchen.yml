---
<% require "json" %>
driver:
  name: parallels
<% if ENV.key?("KITCHEN_PARALLELS_WINDOWS_BOX") %>
  box: <%= ENV.fetch("KITCHEN_PARALLELS_WINDOWS_BOX").to_json %>
<% else %>
  source_vm: <%= ENV.fetch("KITCHEN_PARALLELS_WINDOWS_VM").to_json %>
<% end %>

transport:
  name: winrm
<% if ENV.key?("KITCHEN_WINRM_PROBE") %>
  max_wait_until_ready: 6
  connection_retries: 0
<% end %>
  winrm_transport: ssl
  no_ssl_peer_verification: false
  port: 15986
  client_cert: <%= ENV.fetch("KITCHEN_WINRM_CLIENT_CERT").to_json %>
  client_key: <%= ENV.fetch("KITCHEN_WINRM_CLIENT_KEY").to_json %>

provisioner:
  name: shell
  command: >-
<% if ENV.key?("KITCHEN_SMOKE_EXPECT_ARM64") %>
    if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") { throw "Expected Windows ARM64" };
    Write-Output "Windows guest architecture: ARM64";
<% end %>
    Set-Content -Path (Join-Path $env:TEMP 'kitchen-parallels-smoke.txt') -Value 'converged' -ErrorAction Stop

verifier:
  name: shell
  remote_exec: true
  command: >-
    $marker = Join-Path $env:TEMP 'kitchen-parallels-smoke.txt';
    if ((Get-Content -LiteralPath $marker -ErrorAction Stop) -ne 'converged') { exit 1 }

platforms:
  - name: windows-11
    os_type: windows
    shell_type: powershell

suites:
  - name: smoke
